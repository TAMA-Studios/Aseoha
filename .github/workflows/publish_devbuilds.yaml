name: Automated donator builds

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Fetch full history so the commit list is populated in the payload
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5

      - name: Grant execute permissions for Gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build



      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = './build/resources/main/'
            output_file_path = '/tmp/pack.zip'

      - name: Grant Execute Permissions for Combine script
        run: chmod +x ./scripts/merge_jar.sh
        
      - name: Combine
        run: ./scripts/merge_jar ./build/libs/ /tmp/pack.zip

      - name: Rename artifacts with run number and branch
        run: |
          for f in build/libs/*.jar; do
            base=$(basename "$f" .jar)
            mv "$f" "build/libs/${base}-b${{ github.run_number }}-${{ github.ref_name }}.jar"
          done
          
      - name: Publish artifacts to Discord
        uses: TheDJGamerYt/discord-webhook-upload-action@v0.2.0
        with:
          url: ${{ secrets.DEV_BUILDS }}
          username: TAMAman
          avatar: 'https://media.forgecdn.net/avatars/thumbnails/983/766/256/256/638492366759883163.png'
          file: 'build/libs/*.jar'
          file_attach_mode: last

          # ── Rich embed ──────────────────────────────────────────────────────
          use_embed: true
          embed_color: purple
          embed_title: 'New Aseoha build #${buildNumber} on `${branch}`'
          embed_thumbnail: 'https://media.forgecdn.net/avatars/thumbnails/983/766/256/256/638492366759883163.png'
          embed_footer: '${repoName} • ${workflowName} • [View run](${runUrl})'

          # ── Message body ────────────────────────────────────────────────────
          # %COMMITS% is replaced with one line per commit using message_commit
          message_header: '%COMMITS%'
          message_commit: '> [`${shortSha}`](<${commitUrl}>) **${commitMessage}** — [${authorName}](<${authorUrl}>)'

          # ── Reliability ─────────────────────────────────────────────────────
          retry_count: 3
          retry_delay_ms: 1000
          webhook_suppress_errors: false
