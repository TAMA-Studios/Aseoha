name: Build Release

on:
  push:
    tags:
      - 'v*' # Run on version tags
  workflow_dispatch:

jobs:
  build-mod-jar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/reobfJarJar/output.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [ build-mod-jar ]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mod jar
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: release/

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        run: |
          # Fetch all tags, sort by version, grab the one before the current tag
          git fetch --tags
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ steps.tag.outputs.TAG }}$" | head -n 1)
          echo "PREV_TAG=$PREV" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "ASEOHA ${{ steps.tag.outputs.TAG }}"
          body: |
            ## All Seeing Eye Of Harmony Additions ${{ steps.tag.outputs.TAG }}

            Built automatically from tag `${{ steps.tag.outputs.TAG }}`.

            ### Installation
            Drop the jar into your `mods/` folder.
            
            ### NOTICE
            This mod was designed and built against Forge 47.3.10 for Minecraft 1.20.1. Other versions of Minecraft/Forge MAY work but are not guaranteed to do so. If you're encountering an issue with the mod, first make sure you're on a supported version of Forge and Minecraft. If you are on, say, Minecraft 1.20.4, or Forge 47.4.20, Support may be limited.

            **Full Changelog**: https://github.com/TAMA-Studios/aseoha/compare/${{ steps.prev_tag.outputs.PREV_TAG }}...${{ steps.tag.outputs.TAG }}

          files: ${{ env.JAR_PATH }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}